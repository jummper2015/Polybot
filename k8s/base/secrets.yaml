# k8s/base/secrets.yaml
# PolyBot — Secret Resource para desarrollo local (sin Vault)
#
# ⚠️  ESTE SECRET ES SOLO PARA DESARROLLO LOCAL.
#     En producción, los secrets se inyectan vía Vault Agent Injector.
#     Las anotaciones de Vault están en los pod templates de cada deployment.
#
# Las referencias secretKeyRef en los deployments apuntan a este Secret.
# En entornos con Vault, el entrypoint del pod hace source de
# /vault/secrets/*.env y sobreescribe estos valores.
#
# Uso en desarrollo:
#   kubectl create secret generic polybot-secrets --from-env-file=.env
#
# Uso en producción (con Vault):
#   Los deployments ya tienen las anotaciones vault.hashicorp.com/*
#   en sus pod templates. Ver k8s/vault/README.md para el setup completo.
---
apiVersion: v1
kind: Secret
metadata:
  name: polybot-secrets
  labels:
    app: polybot
type: Opaque
# Los datos se inyectan con kubectl create secret --from-env-file=.env
# o manualmente con kubectl edit secret polybot-secrets
