# k8s/base/serviceaccount.yaml
# PolyBot — ServiceAccount para autenticación Kubernetes → Vault
#
# El Vault Agent Injector usa este SA para autenticar contra Vault
# y obtener los secrets inyectados en el pod.
#
# Cada namespace tiene su propio role en Vault:
#   staging  → polybot-staging  (SA polybot, NS staging)
#   canary   → polybot-canary   (SA polybot, NS canary)
#   production → polybot-production (SA polybot, NS production)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polybot
  labels:
    app: polybot
