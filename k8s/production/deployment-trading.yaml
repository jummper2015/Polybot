# k8s/production/deployment-trading.yaml
# PolyBot — Production: Real Trading (dinero real sin cap)
# Solo se despliega tras aprobación manual en CI/CD.
# Environment "production" en GitHub requiere reviewer approval.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polybot-trading
  namespace: production
  labels:
    app: polybot
    component: trading
    environment: production
    trading-mode: real
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Solo una instancia real activa
  selector:
    matchLabels:
      app: polybot
      component: trading
  template:
    metadata:
      labels:
        app: polybot
        component: trading
        environment: production
        trading-mode: real
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "polybot-production"
        vault.hashicorp.com/agent-inject-secret-polybot.env: "secret/data/polybot"
        vault.hashicorp.com/agent-inject-template-polybot.env: |
          {{- with secret "secret/data/polybot" -}}
          POLYMARKET_PRIVATE_KEY={{ .Data.data.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_API_KEY={{ .Data.data.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET={{ .Data.data.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE={{ .Data.data.POLYMARKET_API_PASSPHRASE }}
          POLYMARKET_WALLET_ADDRESS={{ .Data.data.POLYMARKET_WALLET_ADDRESS }}
          TELEGRAM_BOT_TOKEN={{ .Data.data.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID={{ .Data.data.TELEGRAM_ADMIN_CHAT_ID }}
          REAL_MODE_PIN={{ .Data.data.REAL_MODE_PIN }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-polybot-infra.env: "secret/data/polybot-infra"
        vault.hashicorp.com/agent-inject-template-polybot-infra.env: |
          {{- with secret "secret/data/polybot-infra" -}}
          DATABASE_URL={{ .Data.data.DATABASE_URL }}
          REDIS_URL={{ .Data.data.REDIS_URL }}
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: polybot
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: trading
          image: ghcr.io/polymarket-bot/polymarket-bot:stable
          imagePullPolicy: IfNotPresent  # Producción: no pull ciego
          command: ["/bin/sh", "-c"]
          args:
            - |
              for f in /vault/secrets/*.env; do
                [ -f "$f" ] && set -a && . "$f" && set +a
              done
              exec python main.py
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # ── Real trading mode ─────────────────────────────────────
            - name: TRADING_MODE
              value: "real"
            # ── ConfigMap ─────────────────────────────────────────────
            - name: POSITION_SIZE_USDC
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: POSITION_SIZE_USDC
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: REDIS_URL
            - name: BAT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_THRESHOLD
            - name: BAT_STOP_LOSS_PCT
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_STOP_LOSS_PCT
            - name: BAT_TARGET_PRICE
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_TARGET_PRICE
            - name: BAT_REQUIRED_TICKS
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_REQUIRED_TICKS
            - name: BAT_MAX_SPREAD
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_MAX_SPREAD
            - name: BAT_MIN_VOLUME_USDC
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_MIN_VOLUME_USDC
            - name: RISK_MIN_BALANCE
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MIN_BALANCE
            - name: RISK_MAX_DRAWDOWN_PCT
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MAX_DRAWDOWN_PCT
            - name: RISK_MAX_EXPOSURE_PCT
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MAX_EXPOSURE_PCT
            - name: RISK_MAX_POSITIONS
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MAX_POSITIONS
            - name: KELLY_CAP
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_CAP
            - name: KELLY_SAFETY_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_SAFETY_FACTOR
            - name: KELLY_POSITION_FLOOR
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_POSITION_FLOOR
            - name: KELLY_POSITION_CAP
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_POSITION_CAP
            # ── Secrets desde Vault ───────────────────────────────────
            - name: POLYMARKET_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: POLYMARKET_PRIVATE_KEY
            - name: POLYMARKET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: POLYMARKET_API_KEY
            - name: POLYMARKET_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: POLYMARKET_API_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: DATABASE_URL
            - name: REAL_MODE_PIN
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: REAL_MODE_PIN
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      # ── Anti-affinity: no co-ubicar con otros trading pods ──────────
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values: ["trading"]
              topologyKey: kubernetes.io/hostname
      # ── Toleration: permitir scheduling en spot instances (ahorro) ─
      tolerations:
        - key: "spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
