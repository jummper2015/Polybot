# k8s/staging/deployment-api.yaml
# PolyBot — Staging: FastAPI (2 réplicas + HPA)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polybot-api
  namespace: staging
  labels:
    app: polybot
    component: api
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: polybot
      component: api
  template:
    metadata:
      labels:
        app: polybot
        component: api
        environment: staging
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "polybot-staging"
        vault.hashicorp.com/agent-inject-secret-polybot.env: "secret/data/polybot"
        vault.hashicorp.com/agent-inject-template-polybot.env: |
          {{- with secret "secret/data/polybot" -}}
          POLYMARKET_PRIVATE_KEY={{ .Data.data.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_API_KEY={{ .Data.data.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET={{ .Data.data.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE={{ .Data.data.POLYMARKET_API_PASSPHRASE }}
          POLYMARKET_WALLET_ADDRESS={{ .Data.data.POLYMARKET_WALLET_ADDRESS }}
          TELEGRAM_BOT_TOKEN={{ .Data.data.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID={{ .Data.data.TELEGRAM_ADMIN_CHAT_ID }}
          REAL_MODE_PIN={{ .Data.data.REAL_MODE_PIN }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-polybot-infra.env: "secret/data/polybot-infra"
        vault.hashicorp.com/agent-inject-template-polybot-infra.env: |
          {{- with secret "secret/data/polybot-infra" -}}
          DATABASE_URL={{ .Data.data.DATABASE_URL }}
          REDIS_URL={{ .Data.data.REDIS_URL }}
          {{- end }}
    spec:
      serviceAccountName: polybot
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/polymarket-bot/polymarket-bot:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              for f in /vault/secrets/*.env; do
                [ -f "$f" ] && set -a && . "$f" && set +a
              done
              exec python main.py
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: TRADING_MODE
              value: "paper"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: DATABASE_URL
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: PYTHONUNBUFFERED
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          resources:
            requests:
              cpu: "125m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
# ── HPA (Horizontal Pod Autoscaler) ────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: polybot-api
  namespace: staging
  labels:
    app: polybot
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: polybot-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
