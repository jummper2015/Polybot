# k8s/staging/service.yaml
# PolyBot — Staging: Service para exponer la API
---
apiVersion: v1
kind: Service
metadata:
  name: polybot-api
  namespace: staging
  labels:
    app: polybot
    component: api
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: polybot
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None
