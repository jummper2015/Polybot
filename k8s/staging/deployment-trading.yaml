# k8s/staging/deployment-trading.yaml
# PolyBot — Staging: Trading Bot (paper trading)
# Replicas: 1 (solo una instancia del bot de trading)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polybot-trading
  namespace: staging
  labels:
    app: polybot
    component: trading
    environment: staging
spec:
  replicas: 1
  strategy:
    type: Recreate  # Solo una instancia activa — no rolling update
  selector:
    matchLabels:
      app: polybot
      component: trading
  template:
    metadata:
      labels:
        app: polybot
        component: trading
        environment: staging
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "polybot-staging"
        vault.hashicorp.com/agent-inject-secret-polybot.env: "secret/data/polybot"
        vault.hashicorp.com/agent-inject-template-polybot.env: |
          {{- with secret "secret/data/polybot" -}}
          POLYMARKET_PRIVATE_KEY={{ .Data.data.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_API_KEY={{ .Data.data.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET={{ .Data.data.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE={{ .Data.data.POLYMARKET_API_PASSPHRASE }}
          POLYMARKET_WALLET_ADDRESS={{ .Data.data.POLYMARKET_WALLET_ADDRESS }}
          TELEGRAM_BOT_TOKEN={{ .Data.data.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID={{ .Data.data.TELEGRAM_ADMIN_CHAT_ID }}
          REAL_MODE_PIN={{ .Data.data.REAL_MODE_PIN }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-polybot-infra.env: "secret/data/polybot-infra"
        vault.hashicorp.com/agent-inject-template-polybot-infra.env: |
          {{- with secret "secret/data/polybot-infra" -}}
          DATABASE_URL={{ .Data.data.DATABASE_URL }}
          REDIS_URL={{ .Data.data.REDIS_URL }}
          {{- end }}
    spec:
      serviceAccountName: polybot
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: trading
          image: ghcr.io/polymarket-bot/polymarket-bot:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Source Vault-injected secrets (si existen)
              for f in /vault/secrets/*.env; do
                [ -f "$f" ] && set -a && . "$f" && set +a
              done
              exec python main.py
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # ── Modo de trading (sobrescribe ConfigMap) ──────────────
            - name: TRADING_MODE
              value: "paper"
            - name: POSITION_SIZE_USDC
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: POSITION_SIZE_USDC
            # ── Secrets desde Vault ──────────────────────────────────
            - name: POLYMARKET_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: POLYMARKET_PRIVATE_KEY
            - name: POLYMARKET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: POLYMARKET_API_KEY
            - name: POLYMARKET_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: POLYMARKET_API_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: polybot-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: REDIS_URL
            # ── Estrategia BAT ───────────────────────────────────────
            - name: BAT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_THRESHOLD
            - name: BAT_STOP_LOSS_PCT
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_STOP_LOSS_PCT
            - name: BAT_TARGET_PRICE
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_TARGET_PRICE
            - name: BAT_REQUIRED_TICKS
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_REQUIRED_TICKS
            - name: BAT_MAX_SPREAD
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_MAX_SPREAD
            - name: BAT_MIN_VOLUME_USDC
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: BAT_MIN_VOLUME_USDC
            # ── Riesgo ───────────────────────────────────────────────
            - name: RISK_MIN_BALANCE
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MIN_BALANCE
            - name: RISK_MAX_DRAWDOWN_PCT
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MAX_DRAWDOWN_PCT
            - name: RISK_MAX_EXPOSURE_PCT
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MAX_EXPOSURE_PCT
            - name: RISK_MAX_POSITIONS
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: RISK_MAX_POSITIONS
            - name: KELLY_CAP
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_CAP
            - name: KELLY_SAFETY_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_SAFETY_FACTOR
            - name: KELLY_POSITION_FLOOR
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_POSITION_FLOOR
            - name: KELLY_POSITION_CAP
              valueFrom:
                configMapKeyRef:
                  name: polybot-config
                  key: KELLY_POSITION_CAP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
