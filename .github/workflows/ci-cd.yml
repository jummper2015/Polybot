# .github/workflows/ci-cd.yml
# PolyBot — CI/CD Pipeline (P4.1)
#
# Triggers:
#   - push a main
#   - pull_request a main
#   - schedule: backtesting diario 06:00 UTC
#
# Jobs (10):
#   1. lint-and-typecheck    — ruff + mypy + bandit
#   2. security-scan         — pip-audit + trivy
#   3. unit-tests            — pytest tests/unit/ (matrix python 3.11/3.12)
#   4. integration-tests     — pytest tests/integration/ (PG + Redis)
#   5. e2e-tests             — pytest tests/e2e/
#   6. backtest-regression   — CLI backtesting con datos sintéticos
#   7. build-and-push        — Docker build + push a GHCR
#   8. deploy-staging        — kubectl apply namespace staging
#   9. deploy-canary         — kubectl apply namespace canary (real, $50 max)
#  10. deploy-production     — kubectl apply namespace production (manual approval)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Backtesting diario a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger — para hotfixes, redeploys, o backtesting ad-hoc

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ── Global concurrency: solo un pipeline por rama/PR ──────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 1 — LINT & TYPE CHECK
  # ═══════════════════════════════════════════════════════════════════════

  lint-and-typecheck:
    name: "Lint & TypeCheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (linter)
        run: ruff check src/

      - name: MyPy (type checker)
        run: mypy src/

      - name: Bandit (SAST)
        run: bandit -r src/ -ll

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 2 — SECURITY SCAN
  # ═══════════════════════════════════════════════════════════════════════

  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pip-audit (dependency CVEs)
        run: pip-audit

      - name: Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Secrets scan
        run: bash scripts/security_scan.sh --ci
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 3 — UNIT TESTS (matrix python 3.11 / 3.12)
  # ═══════════════════════════════════════════════════════════════════════

  unit-tests:
    name: "Unit Tests (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Property-based tests
        run: pytest tests/property/ -v --tb=short

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 4 — INTEGRATION TESTS (PostgreSQL + Redis services)
  # ═══════════════════════════════════════════════════════════════════════

  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polybot
          POSTGRES_PASSWORD: polybot_test
          POSTGRES_DB: polybot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://polybot:polybot_test@localhost:5432/polybot_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Integration tests
        run: pytest tests/integration/ -v --tb=short
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polybot
          POSTGRES_PASSWORD: polybot_test
          POSTGRES_DB: polybot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://polybot:polybot_test@localhost:5432/polybot_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: E2E tests
        run: pytest tests/e2e/ -v --tb=short

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 6 — BACKTEST REGRESSION
  # ═══════════════════════════════════════════════════════════════════════

  backtest-regression:
    name: "Backtest Regression"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Backtest BTC 5m (synthetic)
        run: |
          python -m src.backtesting.cli \
            --asset BTC --window 5m --synthetic --n-ticks 500 \
            --threshold 0.75 --stop-loss 0.15 --target 0.90 --balance 1000 \
            --no-save

      - name: Backtest BTC 15m (synthetic)
        run: |
          python -m src.backtesting.cli \
            --asset BTC --window 15m --synthetic --n-ticks 500 \
            --threshold 0.75 --stop-loss 0.15 --target 0.90 --balance 1000 \
            --no-save

      - name: Backtest ETH 5m (synthetic)
        run: |
          python -m src.backtesting.cli \
            --asset ETH --window 5m --synthetic --n-ticks 500 \
            --threshold 0.75 --stop-loss 0.15 --target 0.90 --balance 1000 \
            --no-save

      - name: Backtest ETH 15m (synthetic)
        run: |
          python -m src.backtesting.cli \
            --asset ETH --window 15m --synthetic --n-ticks 500 \
            --threshold 0.75 --stop-loss 0.15 --target 0.90 --balance 1000 \
            --no-save

      - name: Parameter sweep (daily schedule only)
        if: github.event_name == 'schedule'
        run: |
          python -m src.backtesting.cli \
            --asset BTC --window 5m --synthetic --n-ticks 2000 --sweep \
            --no-save

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 7 — BUILD & PUSH DOCKER IMAGE
  # ═══════════════════════════════════════════════════════════════════════

  build-and-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, security-scan, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 8 — DEPLOY STAGING (paper trading, auto-deploy on main push)
  # ═══════════════════════════════════════════════════════════════════════

  deploy-staging:
    name: "Deploy → Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push, backtest-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.polybot.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Apply staging manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap.yaml
          kubectl apply -f k8s/base/secrets.yaml
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/polybot-trading -n staging --timeout=5m
          kubectl rollout status deployment/polybot-api -n staging --timeout=5m

      - name: Health check
        run: |
          sleep 10
          kubectl run health-check --rm -i --restart=Never -n staging \
            --image=curlimages/curl:latest -- \
            curl -f http://polybot-api.staging.svc.cluster.local:8000/api/v1/health

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 9 — DEPLOY CANARY (real trading, $50 max — manual trigger)
  # ═══════════════════════════════════════════════════════════════════════

  deploy-canary:
    name: "Deploy → Canary (real, $50 max)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: canary
      url: https://canary.polybot.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_CANARY }}

      - name: Apply canary manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap.yaml
          kubectl apply -f k8s/base/secrets.yaml
          kubectl apply -f k8s/canary/
          kubectl rollout status deployment/polybot-trading -n canary --timeout=5m

      - name: Verify canary mode
        run: |
          TRADING_MODE=$(kubectl get configmap polybot-config -n canary \
            -o jsonpath='{.data.TRADING_MODE}')
          if [[ "$TRADING_MODE" != "real" ]]; then
            echo "❌ Expected TRADING_MODE=real, got '$TRADING_MODE'"
            exit 1
          fi
          echo "✅ Canary deployed in real mode ($50 max)"

  # ═══════════════════════════════════════════════════════════════════════
  #  JOB 10 — DEPLOY PRODUCTION (real trading, manual approval required)
  # ═══════════════════════════════════════════════════════════════════════

  deploy-production:
    name: "Deploy → Production (manual approval)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://polybot.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Apply production manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap.yaml
          kubectl apply -f k8s/base/secrets.yaml
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/polybot-trading -n production --timeout=5m
          kubectl rollout status deployment/polybot-api -n production --timeout=5m
          kubectl rollout status deployment/polybot-telegram -n production --timeout=5m

      - name: Post-deploy verification
        run: |
          sleep 15
          kubectl run health-check --rm -i --restart=Never -n production \
            --image=curlimages/curl:latest -- \
            curl -f http://polybot-api.production.svc.cluster.local:8000/api/v1/health

  # ═══════════════════════════════════════════════════════════════════════
  #  PIPELINE SUMMARY (always runs, reports overall status)
  # ═══════════════════════════════════════════════════════════════════════

  pipeline-summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - security-scan
      - unit-tests
      - integration-tests
      - e2e-tests
      - backtest-regression
    if: always()
    steps:
      - name: Check results
        run: |
          echo "📊 CI/CD Pipeline Results"
          echo "========================="
          NEEDS='${{ toJson(needs) }}'
          echo "$NEEDS" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          passed = sum(1 for j in needs.values() if j.get('result') == 'success')
          total = len(needs)
          print(f'  ✅ {passed}/{total} jobs passed')
          for name, info in needs.items():
              result = info.get('result', 'skipped')
              icon = '✅' if result == 'success' else '❌' if result == 'failure' else '⏭️'
              print(f'  {icon} {name}: {result}')
          if passed < total:
              sys.exit(1)
          "
