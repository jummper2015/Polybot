# pyproject.toml

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "polymarket-bot"
version     = "1.0.0"
description = "Algorithmic trading bot for Polymarket BTC/ETH markets"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ─────────────────────────────────────────────
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # ── Telegram Bot ──────────────────────────────────────────────
    "aiogram==3.7.0",

    # ── Base de Datos ─────────────────────────────────────────────
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",

    # ── Redis ─────────────────────────────────────────────────────
    "redis[hiredis]==5.0.4",

    # ── HTTP Client ───────────────────────────────────────────────
    "httpx==0.27.0",

    # ── WebSocket ─────────────────────────────────────────────────
    "websockets==12.0",

    # ── Observabilidad ────────────────────────────────────────────
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.24.0",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-exporter-otlp==1.24.0",

    # ── Utilidades ────────────────────────────────────────────────
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",       # TestClient de FastAPI
    "factory-boy==3.3.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "locust==2.44.0",      # Performance testing (P3.4)
    "bandit==1.9.4",       # Security SAST (P3.5)
    "pip-audit==2.10.0",   # Dependency CVE scanning (P3.5)
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode  = "auto"
testpaths     = ["tests"]
python_files  = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true