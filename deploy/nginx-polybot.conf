# deploy/nginx-polybot.conf
# =============================================================================
# PolyBot — Nginx Reverse Proxy Configuration
# =============================================================================
# Uso:
#   1. Copia este archivo a: /etc/nginx/sites-available/polybot
#   2. Reemplaza "tudominio.com" por tu dominio real
#   3. Activa: sudo ln -s /etc/nginx/sites-available/polybot /etc/nginx/sites-enabled/
#   4. Verifica: sudo nginx -t
#   5. Recarga:  sudo systemctl reload nginx
#   6. SSL:      sudo certbot --nginx -d tudominio.com -d www.tudominio.com
# =============================================================================

# ── Redirección HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Para Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Servidor HTTPS principal ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # ── SSL (Certbot autocompleta) ───────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Seguridad ─────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Límites ───────────────────────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=polybot_api:10m rate=20r/s;
    limit_req zone=polybot_api burst=30 nodelay;

    # ── Proxy Principal → PolyBot API (puerto 8000) ───────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Métricas Prometheus (solo acceso local) ───────────────────────────────
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # ── Health Check ──────────────────────────────────────────────────────────
    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Grafana (solo acceso local — usar túnel SSH) ─────────────────────────
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # ── Prometheus (solo acceso local — usar túnel SSH) ──────────────────────
    location /prometheus/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
}
